<html lang="en">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(60deg, #066b99 20%, #00082e 90%);
            color: #b1e8fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            font-family: Outfit, system-ui, sans-serif;
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #010f15;
            border-bottom: solid 1px #000000;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
        }

        .toolbar button {
            background: rgb(0, 0, 0);
            border: none;
            color: rgb(0, 242, 255);
            font-family: Outfit, sans-serif;
            font-weight: 425;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: #022c3a;
            transform: scale(1.05);
        }

        .toolbar button:active {
            transform: scale(0.95);
        }

        #homeBtn {
            font-size: 20px;
            padding: 4px 14px;
        }

        .toolbar input {
            flex: 1;
            font-family: Outfit, sans-serif;
            font-size: 1em;
            padding: 0.8em 1.2em;
            border-radius: 10px;
            border: none;
            outline: none;
            background: #022c3a;
            color: #b1e8fc;
            transition: box-shadow 0.2s;
        }

        .toolbar input:focus {
            box-shadow: 0 0 0 2px #00eaff;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #111;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
    </style>
</head>

<body>
    <nav>
      <button type="button" class="nav-btn" onclick="location.href='start.html'">
        <img src="media/nav-buttons/home.svg" width="40px" height="40px">
      </button>
      <button type="button" class="nav-btn" onclick="window.location.href='select.html'">
        <img src="media/nav-buttons/game.svg" width="40px" height="40px">
      </button>
      <button type="button" class="nav-btn" aria-current="page" onclick="location.href='search.html'">
        <img src="media/nav-buttons/search.svg" width="40px" height="40px">
      </button>
      <button type="button" class="nav-btn" onclick="location.href='tools.html'">
        <img src="media/nav-buttons/tools.svg" width="40px" height="40px">
      </button>
      <button type="button" class="nav-btn" onclick="location.href='settings.html'">
        <img src="media/nav-buttons/settings.svg" width="40px" height="40px">
      </button>
      <button type="button" class="nav-btn" onclick="location.href='disclaimer.html'">
        <img src="media/nav-buttons/disclaimer.svg" width="40px" height="40px">
      </button>
    </nav>
    <div class="container">
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="homeBtn" title="Home">⌂</button>
                <button id="backBtn" title="Back">←</button>
                <button id="forwardBtn" title="Forward">→</button>
                <button id="reloadBtn" title="Reload">↻</button>
            </div>
            <input type="text" id="urlInput" placeholder="Enter URL...">
            <button id="goBtn">Go</button>
        </div>
        <iframe id="browserFrame" title="Scramjet Browser" src="search-home.html"></iframe>
    </div>
    <!--
        STEP 1: Load the libraries. Keep these as plain <script> tags. Do not turn
        them into type="module" / imports. They put their API on the global object
        (window.$scramjet, window.$scramjetController, window.EpoxyTransport), and
        that only happens in a classic script.

        scramjet/ and controller/ need to live at your site root. The service worker
        loads scramjet.js and scramjet.wasm from /scramjet/ and the inject script
        from /controller/, so keep those paths unless you also change the controller
        config.
    -->
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <!-- Epoxy is the network transport. Drop in a local copy if you don't want the CDN. -->
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <script>
        // STEP 2: Pull the classes off the globals the scripts above set up.
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        const iframe = document.getElementById("browserFrame");
        const urlInput = document.getElementById("urlInput");

        let scramjet = null;
        let frame = null;
        let pendingGo = null;

        function norm(u) {
            var q = (u || "").trim();
            if (/^https?:\/\//i.test(q)) return q;
            if (q && q.indexOf(" ") === -1 && q.indexOf(".") !== -1) return "https://" + q;
            return "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q);
        }

        async function init() {
            try {
                // Wait for the service worker (registered at the bottom) to be active.
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                // STEP 3: Connect a transport to a wisp server.
                // Use your own wisp server in production. Public ones get
                // rate-limited and can go offline.
                const transport = new EpoxyTransport({
                    wisp: "wss://wisp.mercurywork.shop/"
                });

                await transport.init();

                // STEP 4: Create the controller. defaultConfig is fine to start with;
                // change it if you need custom rewriting behaviour.
                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();

                // STEP 5: Bind a frame to the <iframe> and navigate it.
                // The homepage is already loaded via the iframe src above,
                // so only navigate if the user already requested a URL.
                frame = scramjet.createFrame(iframe);
                if (pendingGo) {
                    const url = pendingGo;
                    pendingGo = null;
                    urlInput.value = url;
                    frame.go(url);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Navigate the iframe to whatever is typed in the URL bar.
        function go() {
            const url = norm(urlInput.value);
            urlInput.value = url;
            if (frame) frame.go(url);
            else pendingGo = url;
        }

        // Homepage (search-home.html) posts URLs up for the proxy frame.
        window.addEventListener("message", (e) => {
            if (!e.data || e.data.type !== "dotgui-go" || !e.data.url) return;
            urlInput.value = e.data.url;
            if (frame) frame.go(e.data.url);
            else pendingGo = e.data.url;
        });

        document.getElementById("goBtn").onclick = go;

        // Home button: back to the local homepage, no proxy needed for it.
        document.getElementById("homeBtn").onclick = function() {
            urlInput.value = "";
            pendingGo = null;
            iframe.src = "search-home.html";
        };

        urlInput.addEventListener("keydown", e => {
            if (e.key === "Enter") go();
        });

        // STEP 6: Register the service worker, then boot once it's ready.
        // Service workers only run in a secure context: https:// or http://localhost.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(init);
        } else {
            console.error("No service worker support");
        }
    </script>
<script>
          // dotgui-panic: global panic key, guards typing
          document.addEventListener('keydown', function(e) {
            var t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
            var key = '';
            try { key = localStorage.getItem('dotgui_panic_key') || 'k'; } catch (err) { key = 'k'; }
            if ((e.key || '').toLowerCase() !== (key || '').toLowerCase() || !key) return;
            try {
              document.title = 'Google';
              var f = document.querySelector("link[rel~='icon']");
              if (f) f.href = 'https://www.google.com/favicon.ico';
            } catch (err) {}
            var go = true, url = 'https://classroom.google.com';
            try {
              go = (localStorage.getItem('dotgui_panic_redirect') || 'true') === 'true';
              url = localStorage.getItem('dotgui_panic_url') || url;
            } catch (err) {}
            if (go && url) window.location.href = url;
          });
        </script>
</body>
  <script>
    (function() {
      const value = localStorage.getItem('tabCloaker') || 'default';
      const favicon = document.querySelector("link[rel~='icon']") || (() => {
        const link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
        return link;
      })();
      if (value === 'google') {
        document.title = 'Google';
        favicon.href = 'https://www.google.com/favicon.ico';
      } else if (value === 'vocab') {
        document.title = 'My Learning | Vocabulary.com';
        favicon.href = 'https://www.vocabulary.com/favicon.ico';
      } else if (value === 'canvas') {
          document.title = 'Canvas';
          favicon.href = 'https://canvas.instructure.com/favicon.ico';
        } else if (value === 'drive') {
          document.title = 'Google Drive';
          favicon.href = 'https://drive.google.com/favicon.ico';
        } else if (value === 'docs') {
          document.title = 'Google Docs';
          favicon.href = 'https://docs.google.com/favicon.ico';
        } else {
        favicon.href = 'favicon.ico';
      }
    })();
  </script>

</html>
