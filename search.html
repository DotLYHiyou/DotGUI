    <div id="games">
      <main>
        <img src="media/error.webp" width="200" height="200" style="display:block;margin:0 auto;">
        <h1>OH NOES!</h1>
        <h3>Search temporarily unavailable rn. Try not to lose it</h3>

  <script>
    (function() {
      const value = localStorage.getItem('tabCloaker') || 'default';
      const favicon = document.querySelector("link[rel~='icon']") || (() => {
        const link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
        return link;
      })();
      if (value === 'google') {
        document.title = 'Google';
        favicon.href = 'https://www.google.com/favicon.ico';
      } else if (value === 'vocab') {
        document.title = 'My Learning | Vocabulary.com';
        favicon.href = 'https://www.vocabulary.com/favicon.ico';
      } else {
        document.title = 'Search';
        favicon.href = 'favicon.ico';
      }
    })();
  </script>
</html>
